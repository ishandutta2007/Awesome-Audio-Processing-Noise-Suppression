<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".3"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="lightGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes jitter{0%{transform:translateY(0) scaleY(1);opacity:.35}50%{transform:translateY(-3px) scaleY(1.15);opacity:.5}}@keyframes pulseClean{0%{transform:translateY(0);opacity:.85}}@keyframes equalize{0%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes floatNode{0%{transform:translate(0,0)}}@keyframes ringPulse{0%{r:6px;opacity:.8;stroke-width:2px}}.noisy-wave{animation:jitter 3s ease-in-out infinite alternate}.clean-wave{animation:pulseClean 4s ease-in-out infinite alternate}.spectrum-bar{transform-origin:bottom;animation:equalize 1.8s ease-in-out infinite alternate}.dsp-node{animation:floatNode 6s ease-in-out infinite alternate}.dsp-pulse{animation:ringPulse 3s cubic-bezier(.4,0,.6,1) infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><circle cx="180" cy="100" r="140" fill="url(#glowGrad1)"/><circle cx="1020" cy="300" r="160" fill="url(#glowGrad2)"/><g stroke="#334155" stroke-opacity=".15" stroke-width="1"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="200" x2="200" y1="0" y2="400"/><line x1="400" x2="400" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="800" x2="800" y1="0" y2="400"/><line x1="1000" x2="1000" y1="0" y2="400"/></g><g fill="none" stroke="#f43f5e" stroke-width="2" class="noisy-wave" opacity=".45"><path d="M 40 330 Q 70 290 90 340 T 130 300 T 170 360 T 210 270 T 250 350 T 290 280 T 330 340 T 370 290"/><path stroke="#fb7185" stroke-width="1.2" d="M 40 330 Q 60 360 80 320 T 120 370 T 160 280 T 200 350 T 240 290 T 280 360 T 320 300 T 360 340" opacity=".6"/></g><g fill="url(#accentGrad)" opacity=".4" transform="translate(480, 360)"><rect width="6" height="50" x="0" y="-50" class="spectrum-bar" rx="3" style="animation-delay:.1s"/><rect width="6" height="70" x="12" y="-70" class="spectrum-bar" rx="3" style="animation-delay:.3s"/><rect width="6" height="45" x="24" y="-45" class="spectrum-bar" rx="3" style="animation-delay:.7s"/><rect width="6" height="85" x="36" y="-85" class="spectrum-bar" rx="3" style="animation-delay:.2s"/><rect width="6" height="60" x="48" y="-60" class="spectrum-bar" rx="3" style="animation-delay:.5s"/><rect width="6" height="95" x="60" y="-95" class="spectrum-bar" rx="3" style="animation-delay:.9s"/><rect width="6" height="55" x="72" y="-55" class="spectrum-bar" rx="3" style="animation-delay:.4s"/><rect width="6" height="80" x="84" y="-80" class="spectrum-bar" rx="3" style="animation-delay:.6s"/><rect width="6" height="65" x="96" y="-65" class="spectrum-bar" rx="3" style="animation-delay:.8s"/><rect width="6" height="90" x="