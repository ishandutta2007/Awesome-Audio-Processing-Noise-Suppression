<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animated Waveform Styles -->
    <style>
      .noisy-wave {
        animation: jitter 3s ease-in-out infinite alternate;
      }
      .clean-wave {
        animation: pulseClean 4s ease-in-out infinite alternate;
      }
      .spectrum-bar {
        transform-origin: bottom;
        animation: equalize 1.8s ease-in-out infinite alternate;
      }
      .dsp-node {
        animation: floatNode 6s ease-in-out infinite alternate;
      }
      .dsp-pulse {
        animation: ringPulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes jitter {
        0% { transform: translateY(0px) scaleY(1); opacity: 0.35; }
        50% { transform: translateY(-3px) scaleY(1.15); opacity: 0.5; }
        100% { transform: translateY(2px) scaleY(0.9); opacity: 0.35; }
      }

      @keyframes pulseClean {
        0% { transform: translateY(0px); opacity: 0.85; }
        100% { transform: translateY(-4px); opacity: 1; }
      }

      @keyframes equalize {
        0% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
        100% { transform: scaleY(0.5); }
      }

      @keyframes floatNode {
        0% { transform: translate(0, 0); }
        100% { transform: translate(6px, -8px); }
      }

      @keyframes ringPulse {
        0% { r: 6px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
      }
    </style>
  </defs>

  <!-- Deep Slate Tech Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="180" cy="100" r="140" fill="url(#glowGrad1)" />
  <circle cx="1020" cy="300" r="160" fill="url(#glowGrad2)" />

  <!-- Grid Pattern Overlay in Background -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Lower Layer) -->
  
  <!-- Left Side: Noisy Audio Waveform (Raw Input) -->
  <g class="noisy-wave" opacity="0.45" stroke="#f43f5e" stroke-width="2" fill="none">
    <path d="M 40 330 Q 70 290 90 340 T 130 300 T 170 360 T 210 270 T 250 350 T 290 280 T 330 340 T 370 290" />
    <path d="M 40 330 Q 60 360 80 320 T 120 370 T 160 280 T 200 350 T 240 290 T 280 360 T 320 300 T 360 340" stroke="#fb7185" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Dynamic Spectrum Equalizer Bars (Subtle & Below Text) -->
  <g transform="translate(480, 360)" fill="url(#accentGrad)" opacity="0.4">
    <rect class="spectrum-bar" x="0" y="-50" width="6" height="50" rx="3" style="animation-delay: 0.1s;" />
    <rect class="spectrum-bar" x="12" y="-70" width="6" height="70" rx="3" style="animation-delay: 0.3s;" />
    <rect class="spectrum-bar" x="24" y="-45" width="6" height="45" rx="3" style="animation-delay: 0.7s;" />
    <rect class="spectrum-bar" x="36" y="-85" width="6" height="85" rx="3" style="animation-delay: 0.2s;" />
    <rect class="spectrum-bar" x="48" y="-60" width="6" height="60" rx="3" style="animation-delay: 0.5s;" />
    <rect class="spectrum-bar" x="60" y="-95" width="6" height="95" rx="3" style="animation-delay: 0.9s;" />
    <rect class="spectrum-bar" x="72" y="-55" width="6" height="55" rx="3" style="animation-delay: 0.4s;" />
    <rect class="spectrum-bar" x="84" y="-80" width="6" height="80" rx="3" style="animation-delay: 0.6s;" />
    <rect class="spectrum-bar" x="96" y="-65" width="6" height="65" rx="3" style="animation-delay: 0.8s;" />
    <rect class="spectrum-bar" x="108" y="-90" width="6" height="90" rx="3" style="animation-delay: 0.15s;" />
    <rect class="spectrum-bar" x="120" y="-40" width="6" height="40" rx="3" style="animation-delay: 0.55s;" />
    <rect class="spectrum-bar" x="132" y="-75" width="6" height="75" rx="3" style="animation-delay: 0.35s;" />
    <rect class="spectrum-bar" x="144" y="-50" width="6" height="50" rx="3" style="animation-delay: 0.75s;" />
    <rect class="spectrum-bar" x="156" y="-85" width="6" height="85" rx="3" style="animation-delay: 0.25s;" />
    <rect class="spectrum-bar" x="168" y="-60" width="6" height="60" rx="3" style="animation-delay: 0.65s;" />
    <rect class="spectrum-bar" x="180" y="-40" width="6" height="40" rx="3" style="animation-delay: 0.45s;" />
    <rect class="spectrum-bar" x="192" y="-65" width="6" height="65" rx="3" style="animation-delay: 0.85s;" />
    <rect class="spectrum-bar" x="204" y="-35" width="6" height="35" rx="3" style="animation-delay: 0.05s;" />
    <rect class="spectrum-bar" x="216" y="-70" width="6" height="70" rx="3" style="animation-delay: 0.4s;" />
    <rect class="spectrum-bar" x="228" y="-45" width="6" height="45" rx="3" style="animation-delay: 0.7s;" />
  </g>

  <!-- Right Side: Purified, Clean Sine Wave (Restored Speech Output) -->
  <g class="clean-wave" opacity="0.85" filter="url(#lightGlow)">
    <path d="M 830 330 Q 860 280 890 330 T 950 330 T 1010 330 T 1070 330 T 1130 330 T 1170 330" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 830 330 Q 860 295 890 330 T 950 330 T 1010 330 T 1070 330 T 1130 330 T 1170 330" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
  </g>

  <!-- Animated DSP Network Nodes in Background Corners -->
  <g class="dsp-node" opacity="0.6" transform="translate(100, 60)">
    <circle cx="30" cy="30" r="4" fill="#38bdf8" />
    <circle class="dsp-pulse" cx="30" cy="30" r="8" fill="none" stroke="#38bdf8" />
    <line x1="30" y1="30" x2="80" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.5" />
    <circle cx="80" cy="50" r="3" fill="#818cf8" />
  </g>

  <g class="dsp-node" opacity="0.6" transform="translate(1000, 60)">
    <circle cx="50" cy="30" r="4" fill="#c084fc" />
    <circle class="dsp-pulse" cx="50" cy="30" r="8" fill="none" stroke="#c084fc" />
    <line x1="50" y1="30" x2="10" y2="60" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.5" />
    <circle cx="10" cy="60" r="3" fill="#818cf8" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed pristine contrast & visibility -->

  <!-- Top Category Tag Pill -->
  <g transform="translate(600, 65)">
    <rect x="-165" y="-16" width="330" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="-140" cy="0" r="4" fill="#10b981" />
    <text x="-125" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">AWESOME REPOSITORY</text>
    <text x="50" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED LIST</text>
  </g>

  <!-- Main Repository Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" filter="url(#glow)" letter-spacing="-0.5">
    Audio Processing &amp; Noise Suppression
  </text>

  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    The Definitive Guide to Real-Time Speech Enhancement, Neural Denoising &amp; DSP Engines
  </text>

  <!-- Foreground Feature Badges / Pills -->
  <g transform="translate(600, 240)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="72" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🎙️ Real-Time DSP</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="75" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#818cf8">🧠 Neural Denoising</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="75" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a855f7">⚡ Low Latency (&lt;10ms)</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="75" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ec4899">🌐 Open Source &amp; SaaS</text>
    </g>
  </g>

</svg>
